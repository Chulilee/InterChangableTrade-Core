name: Build and TypeScript Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run TypeScript check
      run: npx tsc --noEmit
      
    - name: Build the project
      run: npm run build

  docker-image:
    name: Build production container
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build image with production Dockerfile
      run: docker build --tag interchangabletrade-core:ci .
    - name: Record final image size
      run: docker image inspect interchangabletrade-core:ci --format='Image size: {{.Size}} bytes'
